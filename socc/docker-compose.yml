name: socc

services:
  postgres:
    image: postgres:16-alpine
    container_name: socc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: socc_owner
      POSTGRES_PASSWORD: ${SOC_POSTGRES_PASSWORD:?SOC_POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: socc
      SOC_APP_DB_PASSWORD: ${SOC_APP_DB_PASSWORD:?SOC_APP_DB_PASSWORD is required (see .env.example)}
    ports:
      - "${SOC_POSTGRES_PORT:-5433}:5432"
    volumes:
      - socc_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socc_owner -d socc"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: socc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${SOC_REDIS_PORT:-6380}:6379"
    volumes:
      - socc_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  socc_pgdata:
    name: socc_pgdata
  socc_redisdata:
    name: socc_redisdata
